<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="Toolcube is a directory of 150+ AI tools for chat, images, video, audio, coding, writing and business. Find the right AI tool and visit it in one click.">
<title>Toolcube - Every AI tool, one click away</title>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#f2f0ff;--card:#ffffff;--text:#15123a;--muted:#5d5a86;--a:#7c5cff;--b:#12b8e6;--c:#ff6b8a;--bd:#d8d3fb;--sh:rgba(80,60,200,.22)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0b0a1f;--card:#17153d;--text:#f1efff;--muted:#a19ecf;--a:#8f74ff;--b:#29e0ff;--c:#ff7d9a;--bd:#2c2966;--sh:rgba(0,0,0,.55)}}
:root[data-theme="dark"]{--bg:#0b0a1f;--card:#17153d;--text:#f1efff;--muted:#a19ecf;--a:#8f74ff;--b:#29e0ff;--c:#ff7d9a;--bd:#2c2966;--sh:rgba(0,0,0,.55)}
*{box-sizing:border-box;margin:0}
body{font-family:Sora,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;background-image:radial-gradient(60% 40% at 80% 0,color-mix(in srgb,var(--a) 28%,transparent),transparent),radial-gradient(50% 35% at 0 30%,color-mix(in srgb,var(--b) 18%,transparent),transparent)}
header{display:flex;justify-content:space-between;align-items:center;padding:18px 5vw}
.logo{font-weight:800;font-size:20px}
.logo i{display:inline-block;width:18px;height:18px;margin-right:8px;border-radius:4px;background:linear-gradient(135deg,var(--a),var(--b));transform:rotate(45deg) skew(8deg,8deg);box-shadow:4px 4px 0 var(--c)}
.pill{font-size:13px;color:var(--muted);border:1px solid var(--bd);border-radius:99px;padding:6px 14px;background:var(--card)}
.hero{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:40px;padding:30px 5vw 40px}
.copy{flex:1 1 320px;max-width:560px}
h1{font-size:clamp(34px,6vw,58px);line-height:1.05;font-weight:800;letter-spacing:-.02em}
.copy p{margin:16px 0 22px;color:var(--muted);line-height:1.6;max-width:46ch}
.search{width:100%;padding:15px 20px;border-radius:14px;border:1px solid var(--bd);background:var(--card);color:var(--text);font:inherit;box-shadow:0 12px 30px var(--sh)}
.search:focus,.chip:focus-visible,.visit:focus-visible{outline:3px solid var(--b);outline-offset:2px}
.stage{perspective:900px;width:230px;height:230px;display:grid;place-items:center}
.cube{position:relative;width:130px;height:130px;transform-style:preserve-3d;animation:spin 16s linear infinite}
.stage:hover .cube{animation-play-state:paused}
.f{position:absolute;inset:0;display:grid;place-items:center;font-size:46px;border:1px solid #ffffff66;border-radius:14px;background:linear-gradient(135deg,var(--a),var(--b));opacity:.92}
.f:nth-child(1){transform:translateZ(65px)}.f:nth-child(2){transform:rotateY(90deg) translateZ(65px);background:linear-gradient(135deg,var(--b),var(--c))}
.f:nth-child(3){transform:rotateY(180deg) translateZ(65px)}.f:nth-child(4){transform:rotateY(-90deg) translateZ(65px);background:linear-gradient(135deg,var(--c),var(--a))}
.f:nth-child(5){transform:rotateX(90deg) translateZ(65px)}.f:nth-child(6){transform:rotateX(-90deg) translateZ(65px)}
@keyframes spin{to{transform:rotateX(360deg) rotateY(360deg)}}
.chips{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;padding:0 5vw 26px}
.chip{border:1px solid var(--bd);background:var(--card);color:var(--text);font:inherit;font-size:14px;padding:9px 18px;border-radius:99px;cursor:pointer;box-shadow:0 4px 0 var(--bd);transition:transform .12s,box-shadow .12s}
.chip:active{transform:translateY(3px);box-shadow:0 1px 0 var(--bd)}
.chip.on{background:linear-gradient(135deg,var(--a),var(--b));color:#fff;border-color:transparent;box-shadow:0 4px 0 color-mix(in srgb,var(--a) 60%,#000)}
main{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:26px;padding:10px 5vw 60px;max-width:1240px;margin:auto}
.card{position:relative;transform-style:preserve-3d;background:var(--card);border:1px solid var(--bd);border-radius:20px;padding:22px;box-shadow:0 18px 40px var(--sh),0 6px 0 var(--bd);transition:transform .18s ease-out;will-change:transform}
.ico{position:relative;width:58px;height:58px;display:grid;place-items:center;font-size:21px;font-weight:800;color:#fff;letter-spacing:-.02em;border-radius:16px;transform:translateZ(46px);box-shadow:0 14px 22px var(--sh)}
.ico img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;background:#fff;padding:9px;border-radius:16px}
.card h3{margin:18px 0 4px;font-size:18px;transform:translateZ(28px)}
.tag{font-size:12px;color:var(--a);font-weight:600;transform:translateZ(20px);display:block}
.card p{margin:10px 0 18px;font-size:14px;line-height:1.55;color:var(--muted);min-height:66px;transform:translateZ(12px)}
.visit{display:block;text-align:center;text-decoration:none;color:#fff;font-weight:600;font-size:14px;padding:12px;border-radius:12px;background:linear-gradient(135deg,var(--a),var(--c));transform:translateZ(34px);box-shadow:0 5px 0 color-mix(in srgb,var(--a) 55%,#000)}
.visit:active{transform:translateZ(34px) translateY(4px);box-shadow:0 1px 0 #0006}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:40px}
footer{text-align:center;color:var(--muted);font-size:12.5px;padding:0 5vw 40px}
@media (prefers-reduced-motion:reduce){.cube{animation:none;transform:rotateX(-25deg) rotateY(35deg)}.card{transition:none}}
</style>
</head>
<body>
<header><div class="logo"><i></i>Toolcube</div><div class="pill" id="cnt">Tools opened: 0</div></header>
<section class="hero">
  <div class="copy">
    <h1>Every AI tool, one click away</h1>
    <p>Browse the best AI tools for chat, images, video, audio, code and writing. Pick one and jump straight to its site.</p>
    <input class="search" id="q" type="search" placeholder="Search tools or what you want to do" aria-label="Search AI tools">
  </div>
  <div class="stage" aria-hidden="true"><div class="cube"><div class="f">🤖</div><div class="f">🎨</div><div class="f">🎬</div><div class="f">🎧</div><div class="f">💻</div><div class="f">✍️</div></div></div>
</section>
<nav class="chips" id="chips" aria-label="Categories"></nav>
<main id="grid" aria-live="polite"></main>
<footer>Tool names belong to their owners.</footer>
<script>

HubSpot|Business|CRM with AI marketing tools|hubspot.com
Apollo|Business|Find and email sales leads|apollo.io
Clay|Business|Enrich lead data with AI|clay.com
Instantly|Business|Cold email at scale|instantly.ai
Gong|Business|Insights from sales calls|gong.io
Surfer|Business|Write content that ranks in search|surferseo.com
Semrush|Business|SEO and marketing research|semrush.com
Ahrefs|Business|SEO data and keyword tools|ahrefs.com
Buffer|Business|Plan and write social posts|buffer.com
Predis|Business|Social posts and ads on autopilot|predis.ai
Looka|Business|Logo and brand kit maker|looka.com
Brandmark|Business|Logos and business names|brandmark.io
Namelix|Business|Business name ideas|namelix.com
Julius|Business|Analyse data by chatting|julius.ai
Hex|Business|Data notebooks with AI|hex.tech
Formula Bot|Business|Spreadsheet formulas from text|formulabot.com
Harvey|Business|AI assistant for legal work|harvey.ai
Kittl|Business|Design logos and merch|kittl.com`;
const I={Chat:"💬",Research:"🔎",Image:"🎨",Video:"🎬",Audio:"🎧",Code:"💻",Writing:"✍️",Productivity:"🗂️",Business:"📈"};
const T=D.split("\n").map(l=>{const[a,b,c,e]=l.split("|");return[a,b,c,"https://"+e]});
const cats=["All",...new Set(T.map(t=>t[1]))];
let cat="All",term="",clicks={};
try{clicks=JSON.parse(localStorage.getItem("tc")||"{}")}catch(e){}
const $=id=>document.getElementById(id);
function total(){return Object.values(clicks).reduce((a,b)=>a+b,0)}
function count(){$("cnt").textContent="Tools opened: "+total()}
function chips(){$("chips").innerHTML=cats.map(c=>`<button class="chip${c===cat?" on":""}" data-c="${c}">${c}</button>`).join("")}
function hu(n){let x=0;for(const c of n)x=(x*31+c.charCodeAt(0))%360;return x}
function ini(n){const w=n.split(/[\s.]+/).filter(Boolean);return esc(w.length>1?(w[0][0]+w[1][0]).toUpperCase():n[0].toUpperCase()+n.slice(1,2).toLowerCase())}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function draw(){
  const l=T.filter(t=>(cat==="All"||t[1]===cat)&&(t[0]+t[1]+t[2]).toLowerCase().includes(term));
  $("grid").innerHTML=l.length?l.map(t=>`<article class="card"><div class="ico" style="background:linear-gradient(135deg,hsl(${hu(t[0])} 78% 58%),hsl(${(hu(t[0])+55)%360} 85% 46%))">${ini(t[0])}<img src="https://www.google.com/s2/favicons?domain=${new URL(t[3]).hostname}&sz=128" alt="" loading="lazy" onerror="this.remove()"></div><h3>${esc(t[0])}</h3><span class="tag">${t[1]}</span><p>${esc(t[2])}</p><a class="visit" href="${t[3]}" target="_blank" rel="noopener" data-n="${esc(t[0])}">Visit ${esc(t[0])}</a></article>`).join(""):`<div class="empty">No tools match. Try another word or category.</div>`;
}
$("chips").onclick=e=>{const c=e.target.dataset.c;if(c){cat=c;chips();draw()}};
$("q").oninput=e=>{term=e.target.value.trim().toLowerCase();draw()};
$("grid").addEventListener("click",e=>{const a=e.target.closest(".visit");if(!a)return;clicks[a.dataset.n]=(clicks[a.dataset.n]||0)+1;try{localStorage.setItem("tc",JSON.stringify(clicks))}catch(x){}count()});
$("grid").addEventListener("mousemove",e=>{const c=e.target.closest(".card");if(!c||matchMedia("(prefers-reduced-motion:reduce)").matches)return;const r=c.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;c.style.transform=`perspective(800px) rotateX(${-y*14}deg) rotateY(${x*14}deg)`});
$("grid").addEventListener("mouseout",e=>{const c=e.target.closest(".card");if(c&&!c.contains(e.relatedTarget))c.style.transform=""});
chips();draw();count();
</script>
</body>
</html>
